<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" width="800" height="500">
  <title>Ilustración de una ruta turística por el cafetal</title>
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EAF4FA"/>
      <stop offset="1" stop-color="#D3E7F2"/>
    </linearGradient>
    <linearGradient id="agua" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4FA8C7"/>
      <stop offset="1" stop-color="#2E7E9B"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#fondo)"/>

  <!-- Montañas del fondo -->
  <path d="M300 258l96-116 68 78 44-50 92 88z" fill="#7E9AA6" opacity=".42"/>
  <path d="M540 258l56-66 50 66z" fill="#7E9AA6" opacity=".3"/>

  <!-- Río Magdalena -->
  <path d="M0 300c90 0 150 16 232 14 74-2 118-20 190-18 76 2 132 22 198 26 56 4 108-2 180-10v188H0z" fill="url(#agua)"/>
  <g stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity=".45">
    <path d="M60 372c60-8 110 6 168 0"/>
    <path d="M420 396c70-10 130 6 200 0"/>
    <path d="M240 428c64-8 118 6 180 0"/>
  </g>

  <!-- Camino / sendero -->
  <path d="M120 500c40-96 130-140 250-166 128-28 214-72 250-136" fill="none" stroke="#E2C79A" stroke-width="30" stroke-linecap="round" opacity=".9"/>
  <path d="M120 500c40-96 130-140 250-166 128-28 214-72 250-136" fill="none" stroke="#C9A876" stroke-width="4" stroke-dasharray="14 16" opacity=".65"/>

  <!-- Postes de señalización del recorrido -->
  <g>
    <rect x="150" y="392" width="10" height="58" rx="4" fill="#6B4A2E"/>
    <rect x="112" y="366" width="86" height="34" rx="8" fill="#FFFFFF" stroke="#2E7E9B" stroke-width="3"/>
    <path d="M132 383h30M132 390h18" stroke="#2E7E9B" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g>
    <rect x="462" y="316" width="9" height="48" rx="4" fill="#6B4A2E"/>
    <rect x="430" y="292" width="74" height="30" rx="8" fill="#FFFFFF" stroke="#C0392B" stroke-width="3"/>
    <path d="M448 307h22" stroke="#C0392B" stroke-width="4" stroke-linecap="round"/>
    <path d="M478 300l14 7-14 7z" fill="#C0392B"/>
  </g>

  <!-- Grupo de visitantes -->
  <g transform="translate(236 372)">
    <circle cx="0" cy="0" r="17" fill="#E8B08A"/>
    <path d="M-20 44c0-13 9-24 20-24s20 11 20 24z" fill="#2E7E9B"/>
    <rect x="-14" y="-20" width="28" height="8" rx="4" fill="#E8B08A"/>
    <path d="M-16-18h32a4 4 0 0 1 4 4v2H-20v-2a4 4 0 0 1 4-4z" fill="#C0392B"/>
  </g>
  <g transform="translate(298 386)">
    <circle cx="0" cy="0" r="15" fill="#C98A5E"/>
    <path d="M-18 40c0-12 8-22 18-22s18 10 18 22z" fill="#C0392B"/>
    <rect x="-12" y="-18" width="24" height="7" rx="3.5" fill="#C98A5E"/>
  </g>
  <g transform="translate(352 400)">
    <circle cx="0" cy="0" r="12" fill="#F0C9A8"/>
    <path d="M-15 32c0-10 7-18 15-18s15 8 15 18z" fill="#4F7A3A"/>
  </g>

  <!-- Café que sirve la guía -->
  <g transform="translate(390 342)">
    <ellipse cx="0" cy="0" rx="26" ry="7" fill="#FFFFFF" opacity=".95"/>
    <ellipse cx="0" cy="-2" rx="16" ry="4" fill="#6B3F1F" opacity=".7"/>
    <path d="M22-6c8 0 10 10 2 12" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <path d="M-8-12c0-6 6-6 6-12M4-12c0-6 6-6 6-12" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity=".7"/>
  </g>

  <!-- Cartel "Ruta del café" -->
  <g transform="translate(576 96) rotate(3)">
    <rect width="176" height="96" rx="12" fill="#FFFFFF" stroke="#2E7E9B" stroke-width="4"/>
    <rect x="0" y="0" width="176" height="24" rx="12" fill="#2E7E9B"/>
    <rect x="0" y="14" width="176" height="10" fill="#2E7E9B"/>
    <text x="88" y="58" font-family="Baloo 2, Inter, sans-serif" font-size="24" font-weight="700" fill="#2E7E9B" text-anchor="middle">Ruta</text>
    <text x="88" y="82" font-family="Baloo 2, Inter, sans-serif" font-size="24" font-weight="700" fill="#C0392B" text-anchor="middle">del café</text>
  </g>

  <!-- Aves -->
  <g stroke="#4E6E7C" stroke-width="3" stroke-linecap="round" fill="none" opacity=".55">
    <path d="M120 118c8-8 14-8 20 0M140 118c8-8 14-8 20 0"/>
    <path d="M188 88c7-7 12-7 17 0M205 88c7-7 12-7 17 0"/>
  </g>
</svg>