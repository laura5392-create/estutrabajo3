<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" width="800" height="500">
  <title>Ilustración de un puesto de atención al cliente</title>
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0F6FF"/>
      <stop offset="1" stop-color="#DDE9FE"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#fondo)"/>

  <circle cx="120" cy="90" r="50" fill="#0F7BFF" opacity=".10"/>
  <circle cx="690" cy="400" r="60" fill="#22C55E" opacity=".10"/>
  <circle cx="700" cy="110" r="26" fill="#8B5CF6" opacity=".10"/>

  <!-- Burbujas de chat al fondo -->
  <g opacity=".55">
    <rect x="96" y="176" width="150" height="76" rx="22" fill="#FFFFFF"/>
    <path d="M124 252l-8 26 30-26z" fill="#FFFFFF"/>
    <rect x="120" y="202" width="102" height="10" rx="5" fill="#0F7BFF" opacity=".35"/>
    <rect x="120" y="222" width="70" height="10" rx="5" fill="#0F7BFF" opacity=".22"/>
  </g>
  <g opacity=".55">
    <rect x="556" y="118" width="164" height="82" rx="22" fill="#0F7BFF"/>
    <path d="M676 200l10 28-32-28z" fill="#0F7BFF"/>
    <rect x="580" y="146" width="116" height="10" rx="5" fill="#FFFFFF" opacity=".85"/>
    <rect x="580" y="168" width="76" height="10" rx="5" fill="#FFFFFF" opacity=".6"/>
  </g>

  <!-- Monitor con pantalla de atención -->
  <rect x="242" y="196" width="316" height="216" rx="16" fill="#1F2937"/>
  <rect x="260" y="214" width="280" height="180" rx="10" fill="#FFFFFF"/>
  <rect x="282" y="238" width="150" height="12" rx="6" fill="#0F7BFF" opacity=".35"/>
  <rect x="282" y="262" width="110" height="12" rx="6" fill="#0F7BFF" opacity=".22"/>
  <rect x="282" y="300" width="236" height="74" rx="10" fill="#F2F7FF"/>
  <circle cx="316" cy="337" r="17" fill="#0F7BFF"/>
  <path d="M309 337l5 5 10-10" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="346" y="322" width="150" height="11" rx="5" fill="#0F7BFF" opacity=".30"/>
  <rect x="346" y="344" width="104" height="11" rx="5" fill="#0F7BFF" opacity=".18"/>

  <!-- Pie del monitor -->
  <rect x="374" y="412" width="52" height="34" fill="#1F2937"/>
  <rect x="326" y="444" width="148" height="16" rx="8" fill="#1F2937"/>

  <!-- Auriculares -->
  <g transform="translate(0 -6)">
    <path d="M258 190a144 128 0 0 1 284 0" fill="none" stroke="#0F7BFF" stroke-width="17" stroke-linecap="round"/>
    <rect x="228" y="176" width="46" height="82" rx="22" fill="#0F7BFF"/>
    <rect x="238" y="192" width="26" height="50" rx="13" fill="#93C5FD"/>
    <rect x="526" y="176" width="46" height="82" rx="22" fill="#0F7BFF"/>
    <rect x="536" y="192" width="26" height="50" rx="13" fill="#93C5FD"/>
  </g>

  <!-- Teléfono -->
  <g transform="translate(632 300) rotate(14)">
    <rect width="52" height="88" rx="12" fill="#1F2937"/>
    <rect x="8" y="14" width="36" height="58" rx="6" fill="#F2F7FF"/>
    <circle cx="26" cy="81" r="5" fill="#22C55E"/>
  </g>

  <!-- Horario / reloj -->
  <g transform="translate(96 322)">
    <circle cx="0" cy="0" r="44" fill="#FFFFFF" stroke="#0F7BFF" stroke-width="6"/>
    <path d="M0-24V0l16 10" fill="none" stroke="#0F7BFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>