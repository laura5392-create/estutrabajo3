<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" width="800" height="500">
  <title>Ilustración de un puesto de tecnología</title>
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF9FF"/>
      <stop offset="1" stop-color="#D6EFFE"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#fondo)"/>

  <circle cx="112" cy="98" r="50" fill="#0EA5E9" opacity=".12"/>
  <circle cx="692" cy="398" r="56" fill="#8B5CF6" opacity=".10"/>
  <circle cx="672" cy="98" r="26" fill="#0EA5E9" opacity=".12"/>

  <!-- Monitor con código -->
  <rect x="196" y="132" width="408" height="256" rx="16" fill="#1F2937"/>
  <rect x="216" y="152" width="368" height="216" rx="10" fill="#0B1524"/>
  <g>
    <rect x="240" y="180" width="120" height="11" rx="5.5" fill="#22D3EE" opacity=".75"/>
    <rect x="376" y="180" width="88" height="11" rx="5.5" fill="#A78BFA" opacity=".75"/>
    <rect x="264" y="208" width="96" height="11" rx="5.5" fill="#A78BFA" opacity=".6"/>
    <rect x="376" y="208" width="140" height="11" rx="5.5" fill="#22D3EE" opacity=".6"/>
    <rect x="264" y="236" width="140" height="11" rx="5.5" fill="#F472B6" opacity=".6"/>
    <rect x="420" y="236" width="96" height="11" rx="5.5" fill="#22D3EE" opacity=".55"/>
    <rect x="240" y="264" width="112" height="11" rx="5.5" fill="#22D3EE" opacity=".55"/>
    <rect x="368" y="264" width="112" height="11" rx="5.5" fill="#FBBF24" opacity=".6"/>
    <rect x="264" y="292" width="120" height="11" rx="5.5" fill="#A78BFA" opacity=".5"/>
    <rect x="400" y="292" width="76" height="11" rx="5.5" fill="#22D3EE" opacity=".45"/>
    <rect x="240" y="320" width="56" height="11" rx="5.5" fill="#94A3B8" opacity=".5"/>
  </g>
  <rect x="368" y="388" width="64" height="32" fill="#1F2937"/>
  <rect x="308" y="418" width="184" height="16" rx="8" fill="#1F2937"/>

  <!-- Corchetes de código a los lados -->
  <g stroke="#0EA5E9" stroke-width="11" stroke-linecap="round" opacity=".55" fill="none">
    <path d="M172 210l-26 34 26 34"/>
    <path d="M628 210l26 34-26 34"/>
  </g>

  <!-- Nodos / red -->
  <g transform="translate(672 250)">
    <circle cx="0" cy="0" r="30" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="5"/>
    <circle cx="-52" cy="-42" r="15" fill="#A78BFA"/>
    <circle cx="52" cy="-42" r="15" fill="#22D3EE"/>
    <circle cx="-52" cy="46" r="15" fill="#22D3EE"/>
    <circle cx="52" cy="46" r="15" fill="#A78BFA"/>
    <g stroke="#0EA5E9" stroke-width="4" opacity=".55">
      <line x1="-17" y1="-13" x2="-40" y2="-32"/>
      <line x1="17" y1="-13" x2="40" y2="-32"/>
      <line x1="-17" y1="13" x2="-40" y2="34"/>
      <line x1="17" y1="13" x2="40" y2="34"/>
    </g>
    <path d="M-8-8l11 8-11 8z" fill="#0EA5E9"/>
  </g>

  <!-- Smartphone con app -->
  <g transform="translate(112 300) rotate(-8)">
    <rect width="86" height="152" rx="14" fill="#1F2937"/>
    <rect x="9" y="20" width="68" height="112" rx="8" fill="#FFFFFF"/>
    <rect x="9" y="20" width="68" height="22" rx="8" fill="#0EA5E9"/>
    <rect x="20" y="54" width="46" height="30" rx="7" fill="#0EA5E9" opacity=".28"/>
    <rect x="20" y="94" width="46" height="8" rx="4" fill="#0EA5E9" opacity=".32"/>
    <rect x="20" y="110" width="32" height="8" rx="4" fill="#0EA5E9" opacity=".2"/>
    <rect x="34" y="8" width="18" height="5" rx="2.5" fill="#4B5563"/>
  </g>

  <!-- Rayo de velocidad -->
  <g transform="translate(520 402)" fill="none" stroke="#0EA5E9" stroke-width="9" stroke-linecap="round" opacity=".5">
    <path d="M0 0h44M-14 24h38M6-24h40"/>
  </g>
</svg>