<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" width="800" height="500">
  <title>Ilustración de un puesto de educación</title>
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8F4FF"/>
      <stop offset="1" stop-color="#EBE1FE"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#fondo)"/>

  <circle cx="120" cy="100" r="50" fill="#8B5CF6" opacity=".10"/>
  <circle cx="690" cy="395" r="56" fill="#0F7BFF" opacity=".10"/>
  <circle cx="665" cy="95" r="26" fill="#8B5CF6" opacity=".12"/>

  <!-- Pizarra -->
  <rect x="132" y="104" width="536" height="252" rx="16" fill="#2F3E52"/>
  <rect x="148" y="120" width="504" height="220" rx="10" fill="#3D5068"/>
  <rect x="132" y="98" width="536" height="14" rx="7" fill="#8B5CF6"/>

  <!-- Contenido de la pizarra -->
  <g fill="#F8FAFC" opacity=".92">
    <rect x="180" y="156" width="150" height="18" rx="9"/>
    <rect x="180" y="192" width="228" height="12" rx="6" opacity=".55"/>
    <rect x="180" y="218" width="192" height="12" rx="6" opacity=".55"/>
    <rect x="180" y="244" width="210" height="12" rx="6" opacity=".55"/>
    <rect x="180" y="270" width="140" height="12" rx="6" opacity=".55"/>
  </g>
  <g stroke="#F8FAFC" stroke-width="7" stroke-linecap="round" opacity=".92">
    <path d="M466 168l-26 30 26 30"/>
    <path d="M538 168l26 30-26 30"/>
  </g>
  <rect x="494" y="190" width="12" height="52" rx="6" fill="#F8FAFC" opacity=".92"/>
  <text x="592" y="222" font-family="Baloo 2, Inter, sans-serif" font-size="52" font-weight="700" fill="#FBBF24" text-anchor="middle">A</text>

  <!-- Lápiz -->
  <g transform="translate(214 392) rotate(-32)">
    <rect width="30" height="196" rx="6" fill="#FBBF24"/>
    <rect width="30" height="42" fill="#8B5CF6"/>
    <rect x="0" y="196" width="30" height="20" fill="#F8FAFC" opacity=".9"/>
    <path d="M0 216l15 26 15-26z" fill="#1F2937"/>
  </g>

  <!-- Cuaderno -->
  <g transform="translate(316 372)">
    <rect width="176" height="112" rx="10" fill="#FFFFFF" stroke="#C9B6F5" stroke-width="3"/>
    <rect x="0" y="0" width="16" height="112" rx="8" fill="#8B5CF6"/>
    <g fill="#8B5CF6" opacity=".32">
      <rect x="40" y="30" width="112" height="9" rx="4.5"/>
      <rect x="40" y="54" width="88" height="9" rx="4.5"/>
      <rect x="40" y="78" width="102" height="9" rx="4.5"/>
    </g>
    <path d="M128 66l16 16 26-30" fill="none" stroke="#22C55E" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Mesa -->
  <rect x="70" y="450" width="660" height="20" rx="10" fill="#7C3AED"/>
  <rect x="104" y="470" width="20" height="28" rx="6" fill="#6D28D9"/>
  <rect x="676" y="470" width="20" height="28" rx="6" fill="#6D28D9"/>

  <!-- Bombilla de idea -->
  <g transform="translate(108 350)">
    <circle cx="0" cy="0" r="30" fill="#FBBF24"/>
    <rect x="-12" y="26" width="24" height="9" rx="4" fill="#94A3B8"/>
    <rect x="-10" y="39" width="20" height="9" rx="4" fill="#94A3B8"/>
    <path d="M-30-24l-14-12M30-24l14-12M0-42v-18" stroke="#FBBF24" stroke-width="6" stroke-linecap="round"/>
